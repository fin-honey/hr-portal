              '<button class="btn" id="hRescheduleCancel">Скасувати</button></div>' +
          '</div>' +
        '</div>';
      }

      form += field('hNote', 'Примітка HR', text('hNote', 'Примітка HR'), 'Обов\'язкова, якщо заявка скасовується.') +
        '<div class="submit-bar">' +
          '<button class="btn primary" id="hComplete">Виконати</button>' +
          '<button class="btn" id="hSave">Зберегти чернетку</button>' +
          '<button class="btn danger" id="hCancel">Скасувати заявку</button>' +
          '<div class="form-error" id="hError" hidden></div>' +
        '</div></div>';
    }

    $('#hrDetail').innerHTML =
      '<div class="panel">' +
        '<h2>Заявка ' + esc(d.id) + ' ' + statusTag(d.status) + '</h2>' +
        (d.warnings && d.warnings.length
          ? '<div class="status-box err"><b>Проведено, але потрібна ручна дія:</b><br>' + d.warnings.map(esc).join('<br>') + '</div>'
          : '') +
        renderDetailBlocks(d.display) +
        form +
        '<div class="form-actions"><button class="btn" id="hClose">Згорнути</button></div>' +
      '</div>';

    $('#hClose').onclick = () => { $('#hrDetail').innerHTML = ''; };
    if (!open) return;

    const collect = () => {
      const out = { 'Примітка HR': v('#hNote') };
      if (rule.person) out['P-ID'] = v('#hPerson');
      if ($('#hCloseO')) out['O-ID, що закривається'] = v('#hCloseO');
      if (needOrderDate) out['Дата наказу'] = v('#hOrderDate');
      if (rule.openOfficial) {
        out['Юрособа'] = v('#hEntity');
        out['Офіційна посада'] = v('#hOffPos');
        out['Офіційний оклад'] = v('#hSalary');
        out['Офіційний графік'] = v('#hSchedule');
      }
      return out;
    };
    const fail = msg => { const b = $('#hError'); b.textContent = msg; b.hidden = !msg; };
    const run = async (action, payload, okMsg) => {
      fail('');
      try {
        const res = await api(action, typeof payload === 'function' ? await payload() : payload);
        drawHrRequest(res);
        toast(res.warnings && res.warnings.length ? 'Проведено з попередженнями — див. картку заявки' : okMsg, !!(res.warnings && res.warnings.length));
        await loadHrQueue();
        filterHr();
      } catch (e) { if (!e.gate) fail(e.error); }
    };

    if (d.hasVisit) {
      const loadHrSlots = async () => {
        const date = v('#hVisitDate');
        const sel = $('#hVisitHour');
        const keep = sel.value || String(d.visitHour);
        if (!date) { sel.innerHTML = '<option value="">…</option>'; return; }
        try {
          const r = await api('form.slots', { date: date });
          sel.innerHTML = r.slots.map(sl => '<option value="' + sl.hour + '"' + (String(sl.hour) === keep ? ' selected' : '') + '>' +
            String(sl.hour).padStart(2, '0') + ':00 — ' + (sl.busy ? 'зайнято' : 'вільно') + '</option>').join('');
        } catch (e) {
          if (!e.gate) sel.innerHTML = d.visitHours.map(h => '<option value="' + h + '">' + String(h).padStart(2, '0') + ':00</option>').join('');
        }
      };
      $('#hVisitDate').addEventListener('change', loadHrSlots);
      $('#hRescheduleOpen').onclick = () => {
        $('#rescheduleBox').hidden = false;
        $('#hRescheduleOpen').hidden = true;
        loadHrSlots();
      };
      $('#hRescheduleCancel').onclick = () => {
        $('#rescheduleBox').hidden = true;
        $('#hRescheduleOpen').hidden = false;
      };
      $('#hReschedule').onclick = e => withBusy(e.target, () => run('hr.reschedule',
        { id: d.id, date: v('#hVisitDate'), hour: v('#hVisitHour'), comment: v('#hVisitComment') }, 'Візит перенесено'));
    }

    $('#hAssignee').onchange = e => withBusy(e.target, () =>
      run('hr.assign', { id: d.id, email: e.target.value }, e.target.value ? 'Відповідального призначено' : 'Призначення знято'));
    if ($('#hTakeMe')) $('#hTakeMe').onclick = e => withBusy(e.target, () =>
      run('hr.assign', { id: d.id, email: d.me }, 'Заявку взято собі'));

    const bankBlock = $('#bankBlock');
    const syncBank = () => { if (bankBlock) bankBlock.hidden = d.bankEntities.indexOf(v('#hEntity')) === -1; };
    if ($('#hEntity')) $('#hEntity').addEventListener('change', syncBank);
    syncBank();
    if ($('#hIban')) $('#hIban').addEventListener('input', e => {
      const raw = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 29);
      e.target.value = raw.replace(/(.{4})(?=.)/g, '$1 ');
    });
    if ($('#hCard')) $('#hCard').addEventListener('input', e => {
      const digits = e.target.value.replace(/\D/g, '').slice(0, 16);
      e.target.value = digits.replace(/(\d{4})(?=\d)/g, '$1 ');
    });

    const collectBank = async () => {
      if (!bankBlock || bankBlock.hidden) return null;
      const file = $('#hDoc').files[0];
      return { card: v('#hCard'), iban: v('#hIban'), doc: file ? await fileToPayload(file) : null };
    };

    $('#hComplete').onclick = e => withBusy(e.target, () =>
      run('hr.complete', async () => ({ id: d.id, hr: collect(), bank: await collectBank() }), 'Заявку проведено'));
    $('#hSave').onclick = e => withBusy(e.target, () => run('hr.save', { id: d.id, hr: collect() }, 'Чернетку збережено'));
    $('#hCancel').onclick = e => {
      if (!v('#hNote')) { fail('Вкажіть причину скасування в полі «Примітка HR».'); return; }
      confirmTwice(e.target, () => run('hr.cancel', { id: d.id, reason: v('#hNote') }, 'Заявку скасовано'));
    };
  }

  // ---------- Бухгалтерія ----------

  async function renderAccounting() {
    view().innerHTML = '<h1>Бухгалтерія</h1><p class="muted">Завантаження…</p>';
    try {
      drawAccounting(await api('acc.overview'));
    } catch (e) {
      if (!e.gate) view().innerHTML = '<h1>Бухгалтерія</h1><p class="error">' + esc(e.error) + '</p>';
    }
  }

  function drawAccounting(d) {
    view().innerHTML =
      '<h1>Бухгалтерія</h1>' +
      '<p class="lead">Табельні номери для нових оформлень і розрахунки при вибутті.</p>' +

      '<h2>Потрібен табельний номер (' + d.needTab.length + ')</h2>' +
      (d.needTab.length
        ? '<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Юрособа</th><th>Офіційна посада</th><th>Дата прийому</th><th>Табельний номер</th></tr></thead><tbody>' +
            d.needTab.map(t => '<tr><td>' + esc(t.name) + '<div class="muted">' + esc(t.unit) + '</div></td>' +
              '<td>' + esc(t.entity) + (t.doc ? '<div><a href="' + esc(t.doc) + '" target="_blank" rel="noopener">документ рахунку</a></div>' : '') + '</td>' +
              '<td>' + esc(t.position) + '</td><td>' + esc(t.start) + '</td>' +
              '<td class="actions"><div class="inline-edit"><input type="text" data-tab="' + esc(t.oid) + '" placeholder="з 1С">' +
              '<button class="btn link" data-save="' + esc(t.oid) + '">Зберегти</button></div></td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="muted">Усі офіційні оформлення мають табельні номери.</p>') +

      '<h2>Розрахунок при вибутті (' + d.settlements.length + ')</h2>' +
      (d.settlements.length
        ? '<div class="table-wrap"><table><thead><tr><th>Працівник</th><th>Останній робочий день</th><th>Оформлений</th><th>Заявка</th><th></th></tr></thead><tbody>' +
            d.settlements.map(s => '<tr><td>' + esc(s.name) + '<div class="muted">' + esc(s.unit) + '</div></td>' +
              '<td>' + esc(s.lastDay) + '</td><td>' + esc(s.official) + '</td>' +
              '<td>' + esc(s.id) + ' ' + statusTag(s.status) + '</td>' +
              '<td class="actions"><button class="btn link" data-settle="' + esc(s.id) + '">Розраховано</button></td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="muted">Розрахунків, що очікують, немає.</p>');

    view().querySelectorAll('[data-save]').forEach(b => b.onclick = () => withBusy(b, async () => {
      const tab = view().querySelector('[data-tab="' + b.dataset.save + '"]').value;
      const res = await api('acc.setTab', { oid: b.dataset.save, tab: tab });
      drawAccounting(res);
      toast(res.warning || 'Табельний номер збережено', !!res.warning);
    }));
    view().querySelectorAll('[data-settle]').forEach(b => b.onclick = () => confirmTwice(b, async () => {
      drawAccounting(await api('acc.settle', { id: b.dataset.settle }));
      toast('Розрахунок відмічено');
    }));
  }

  // ---------- Файли ----------

  // Файл → { name, mimeType, base64 }. Великі фото стискаються до 2000 px (JPEG)
  async function fileToPayload(file) {
    let blob = file;
    let type = file.type || 'application/octet-stream';
    if (/^image\/(jpeg|png|webp)$/.test(type) && file.size > 1.5 * 1024 * 1024) {
      try { blob = await shrinkImage(file); type = 'image/jpeg'; } catch (e) { blob = file; }
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('Не вдалося прочитати файл'));
      r.readAsDataURL(blob);
    });
    return { name: file.name, mimeType: type, base64: String(dataUrl).split(',')[1] };
  }

  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Не вдалося стиснути фото')), 'image/jpeg', 0.85);
      };
      img.onerror = () => reject(new Error('Не вдалося відкрити фото'));
      img.src = URL.createObjectURL(file);
    });
  }
</script>
<script>
  // ============================================================
  // Окрема сторінка порталу (GitHub Pages).
  // Перевизначає функції з Client.html: виклик бекенду, вхід, вихід.
  // ============================================================

  // Адреси — у файлі config.js поруч із index.html, щоб index.html можна було замінювати повністю
  const CONFIG = window.HR_CONFIG || {};

  const SESSION_KEY = 'hrPortalSession';
  let googleToken = null;   // токен Google — лише на час входу (надіслати код і перевірити його)

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function setSession(s) {
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* приватний режим без localStorage — сесія житиме до закриття сторінки */ }
  }

  // Запит до бекенду. text/plain — щоб браузер не робив попередній CORS-запит, який Apps Script не підтримує
  async function callBackendHttp(action, payload) {
    const body = { action: action, payload: payload || {} };
    const s = getSession();
    const needsGoogle = action === 'auth.sendCode' || action === 'auth.verify';
    if (s && !needsGoogle) body.session = s;
    else body.token = googleToken;

    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const res = await fetch(CONFIG.BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (e) { if (attempt === 2) return { ok: false, error: 'Помилка сервера (код ' + res.status + '). Оновіть сторінку.' }; }
      } catch (e) {
        if (attempt === 2) return { ok: false, error: 'Немає зв’язку з сервером. Перевірте інтернет і оновіть сторінку.' };
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  }

  function api(action, payload) {
    return callBackendHttp(action, payload).then(r => {
      if (r && r.ok) return r.data;
      if (r && GATE_CODES.indexOf(r.code) !== -1 && !action.startsWith('auth.')) {
        showGate(r);
        throw { error: '', gate: true };
      }
      throw (r || { error: 'Порожня відповідь сервера' });
    });
  }

  // ---------- Старт ----------

  async function start() {
    if (!CONFIG.BACKEND_URL || !CONFIG.GOOGLE_CLIENT_ID) {
      view().innerHTML = '<h1>Портал не налаштований</h1><p class="error">Немає файлу config.js або в ньому не заповнені BACKEND_URL і GOOGLE_CLIENT_ID.</p>';
      return;
    }
    if (!getSession()) { clearShell(); return renderLogin(); }
    try {
      state.boot = await api('bootstrap');
      renderShell();
      go('home');
    } catch (e) {
      if (e.gate) return;
      clearShell();
      view().innerHTML = '<h1>Портал не завантажився</h1><p class="error">' + esc(e.error) + '</p>' +
        '<p>Оновіть сторінку. Якщо помилка повторюється, надішліть цей текст адміністратору.</p>';
    }
  }

  function showGate(r) {
    clearShell();
    if (r.code === 'NO_SESSION') { setSession(null); return renderLogin(); }
    if (r.code === 'LOCKED') {
      view().innerHTML = '<h1>Портал тимчасово закритий</h1>' +
        '<p>Доступ закрив адміністратор. Спробуйте пізніше або зверніться до адміністратора.</p>';
      return;
    }
    setSession(null);
    view().innerHTML = '<h1>Немає доступу</h1>' +
      '<p>Акаунт <b>' + esc(r.email || '') + '</b> не доданий до порталу.</p>' +
      '<p>Попросіть адміністратора додати цей email або увійдіть іншим акаунтом.</p>' +
      '<div class="form-actions"><button class="btn primary" id="otherAccount">Увійти іншим акаунтом</button></div>';
    $('#otherAccount').onclick = () => renderLogin();
  }

  // ---------- Вхід: Google → код на пошту ----------

  function jwtEmail(token) {
    try {
      const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(part)))).email || '';
    } catch (e) { return ''; }
  }

  function renderLogin() {
    googleToken = null;
    view().innerHTML =
      '<h1>Вхід у HR портал</h1>' +
      '<div class="panel">' +
        '<div id="googleStep">' +
          '<p>Увійдіть робочим Google-акаунтом. Якщо на пристрої кілька акаунтів — Google запропонує обрати.</p>' +
          '<div id="googleButton" style="min-height:44px"></div>' +
        '</div>' +
        '<div id="codeStep" hidden>' +
          '<p>Акаунт: <b id="loginEmail"></b>. Ми надіслали одноразовий код на цю пошту.</p>' +
          '<div class="field"><label for="otp">Код з листа</label>' +
            '<input type="text" id="otp" inputmode="numeric" autocomplete="off" maxlength="6" class="otp" placeholder="000000">' +
            '<div class="hint">Код дійсний 10 хвилин. Лист може прийти в «Спам». Після введення 6 цифр вхід відбудеться сам.</div></div>' +
          '<div class="form-actions">' +
            '<button class="btn primary" id="verify">Увійти</button>' +
            '<button class="btn" id="resend">Надіслати новий код</button>' +
            '<button class="btn link" id="switchAccount">Інший акаунт</button>' +
          '</div>' +
        '</div>' +
        '<div class="form-error" id="loginError" hidden style="margin-top:16px"></div>' +
      '</div>' +
      '<p class="muted">Якщо кнопка входу не працює, відкрийте портал у Chrome або Safari, а не у вбудованому браузері месенджера.</p>';

    const tryRender = () => {
      if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(tryRender, 200);
      google.accounts.id.initialize({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        callback: onGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true
      });
      google.accounts.id.renderButton($('#googleButton'), {
        theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'uk', width: 280
      });
    };
    tryRender();
  }

  function loginError(msg) {
    const b = $('#loginError');
    if (!b) return;
    b.textContent = msg || '';
    b.hidden = !msg;
  }

  async function sendLoginCode() {
    loginError('');
    try {
      await api('auth.sendCode');
      toast('Код надіслано');
      $('#otp').focus();
    } catch (x) {
      if (x.code === 'NO_ACCESS' || x.code === 'LOCKED') return showGate(x);
      loginError(x.error);
    }
  }

  async function onGoogleCredential(resp) {
    googleToken = resp.credential;
    $('#googleStep').hidden = true;
    $('#codeStep').hidden = false;
    $('#loginEmail').textContent = jwtEmail(googleToken);

    // Кнопка заблокована до повного завантаження порталу — інакше після перевірки коду
    // ще кілька секунд нічого не видно, і людина натискає вдруге
    let verifying = false;
    const verify = async () => {
      if (verifying) return;
      const code = $('#otp').value.replace(/\D/g, '');
      if (code.length !== 6) { loginError('Введіть 6 цифр коду з листа'); return; }
      verifying = true;
      const btn = $('#verify');
      btn.disabled = true;
      btn.textContent = 'Входимо…';
      loginError('');
      try {
        const r = await api('auth.verify', { code: code });
        setSession({ email: r.email, token: r.sessionToken });
        googleToken = null;
        await start();
      } catch (x) {
        loginError(x.error);
        btn.disabled = false;
        btn.textContent = 'Увійти';
        verifying = false;
      }
    };
    $('#verify').onclick = verify;
    $('#otp').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      if (e.target.value.length === 6) verify();
    });
    $('#otp').addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    $('#resend').onclick = e => withBusy(e.target, sendLoginCode);
    $('#switchAccount').onclick = () => renderLogin();

    await sendLoginCode();
  }

  async function logout() {
    try { await api('auth.logout'); } catch (e) { /* сесію однаково вважаємо завершеною */ }
    setSession(null);
    try { google.accounts.id.disableAutoSelect(); } catch (e) { /* бібліотека ще не завантажилась */ }
    clearShell();
    renderLogin();
  }

  start();

</script>
